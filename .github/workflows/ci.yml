name: CI Pipeline

on:
  push:
    branches: [ "master" ]
    paths-ignore:
      - 'docs/**'
      - '**.md'

# 同一分支连续推送时取消上一次运行
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: MdToHtml

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: MdToHtml/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type Check
        run: npm run typecheck

      - name: Lint
        run: npm run lint:strict

      - name: Unit Tests
        run: npm run test:ci

      - name: Build
        run: npm run build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: MdToHtml/.next/

  e2e:
    name: E2E Tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # E2E 已于 2026-09-14 稳定化（7/7 连续两轮通过，见
    # plans/测试工程/00_CI全绿计划书_2026-09-14.md §8），故作为硬门禁要求必须通过。
    # 数据隔离：webServer.env.MDTOHTML_CONFIG=config.e2e.json → 全部读写发生在 .e2e-tmp/
    defaults:
      run:
        working-directory: MdToHtml

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: MdToHtml/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: MdToHtml/playwright-report/

      - name: Upload Test Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-screenshots
          path: MdToHtml/test-results/