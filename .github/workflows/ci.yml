name: CI Pipeline

# =============================================================================
# 触发说明（2026-09-14 修正）
#   仓库已迁移到 GitHub（origin = git@github.com:lihua6527-beep/MdToHtml.git），
#   默认分支为 main（由本地 master 推送而来），本地主线仍叫 master。
#   此前只监听 "master" —— 而 GitHub 上并不存在该分支，导致推送后 CI 从不触发。
#   现同时监听 main 与 master，两者等价（当前同一提交），任一侧推送都会跑门禁。
#   workflow_dispatch 预留手动触发：可在 Actions 页面选任意分支跑一次。
# =============================================================================
on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

# 同一分支连续推送时取消上一次运行
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # CI 门禁不需要 Electron 二进制：只需 next build / jest / playwright。
  # 跳过后 npm ci 少下载约 90MB，也避免 electron 镜像不可达拖垮门禁。
  # 真正需要 Electron 的是 release.yml（Windows runner 打包便携 exe）。
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: MdToHtml

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: MdToHtml/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type Check
        run: npm run typecheck

      - name: Lint
        run: npm run lint:strict

      - name: Unit Tests
        run: npm run test:ci

      # 覆盖率看板：把四项覆盖率写进本次运行的 Summary（无需 Codecov 账号）。
      # continue-on-error：看板本身不允许影响门禁结果。
      - name: Publish Coverage Summary
        if: always()
        continue-on-error: true
        run: node scripts/coverage-summary.js

      - name: Build
        run: npm run build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: MdToHtml/.next/

  e2e:
    name: E2E Tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # E2E 已于 2026-09-14 稳定化（7/7 连续两轮通过，见
    # plans/测试工程/00_CI全绿计划书_2026-09-14.md §8），故作为硬门禁要求必须通过。
    # 数据隔离：webServer.env.MDTOHTML_CONFIG=config.e2e.json → 全部读写发生在 .e2e-tmp/
    defaults:
      run:
        working-directory: MdToHtml

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: MdToHtml/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: MdToHtml/playwright-report/

      - name: Upload Test Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-screenshots
          path: MdToHtml/test-results/
