# =============================================================================
# Gitee Go 流水线定义 —— 方案 B（2026-09-14 选定；同日第二轮修正）
#
# 为什么需要这个文件：
#   远端仓库在 Gitee（https://gitee.com/njustzjh/md-to-html），而 .github/workflows/*.yml
#   是 GitHub Actions，Gitee 不会执行它们。要让门禁在远端真实运行，必须改用 Gitee Go。
#
# ---------------------------------------------------------------------------
# 【第二轮修正的原因】2026-09-14 21:30 第一次真实运行失败，日志原文（摘录）：
#   The task image's version is plugin-24
#   /mnt/pipeline-tools/plugins/node/1.0/step.sh: line 46: npm: command not found
#   ################################# start exec user define command ############
#   + cd MdToHtml
#   + npm ci
#   /opt/COMMAND.sh: line 2: npm: command not found
#   + cd MdToHtml
#   /opt/COMMAND.sh: line 3: cd: MdToHtml: No such file or directory
#   /opt/COMMAND.sh: line 4: cd: MdToHtml: No such file or directory
#   /opt/COMMAND.sh: line 5: cd: MdToHtml: No such file or directory
#   The task build Failure! / fail to run command, exit code: 255
#
# 从这段日志能确定三个事实（后两条是本轮最重要的发现，改法直接由它们推导）：
#   ① 执行镜像 ubuntu:plugin-24 **没有 Node/npm**：连插件自己的 step.sh:46 调 npm 都失败；
#      插件字段 nodeVersion 只声明版本，并未把 Node 装进这个镜像。
#   ② 同一个 step 的多条 commands **共用同一个 shell**：第 1 条命令的 `cd MdToHtml` 是成功的
#      （所以 line 2 报的是 npm 找不到，而不是 cd 找不到），工作目录因此被改到 MdToHtml/；
#      第 2~4 条再执行 `cd MdToHtml`，就落到了不存在的一层 → line 3/4/5 连续报 cd 失败。
#   ③ 平台会把所有 commands 顺序执行完再判定失败（没有 set -e），一条失败不会中断后续命令。
#
# 三条对策（本轮已落地，见各 stage 的 commands）：
#   A. 不依赖镜像/插件自带 Node：每个 stage 第 2 条命令做**兜底安装**（仅当 `command -v npm`
#      失败时执行；npmmirror → nodejs.org → 清华镜像三源回退，按 uname -m 选 x64/arm64），
#      之后每条命令自行 `export PATH="$HOME/node20/bin:$PATH"`（不依赖 PATH 跨行保持）。
#   B. 每条命令用**子 shell** `( cd MdToHtml && … )` 包住 → 命令之间不再互相污染 cwd；
#      同一条命令内部用 `&&` 串联 → 任一环节失败该命令退出码非 0，门禁才真正「会红」。
#   C. 每个 stage 第 1 条命令打印环境探测（pwd / PATH / node / npm / curl）→ 下一次运行的
#      日志即可自证"Node 问题是否解决"，不必再靠猜。
# ---------------------------------------------------------------------------
#
# 与本地门禁的等价关系（本地已实测通过：25 套件 / 213 用例、E2E 7/7）：
#   .github/workflows/ci.yml  build job  →  npm run typecheck && npm run lint:strict && npm run test:ci
#   .github/workflows/ci.yml  e2e   job  →  npm run build（+ npx playwright install chromium）&& npm run test:e2e
#
# 结构校验进展（2026-09-14，据 Gitee 页面报错与官方模板迭代）：
#   ✅ 已确认：version / name / displayName；stage 为扁平写法
#              （name / displayName / strategy: naturally / trigger: auto / steps）
#   ✅ 已确认（依据页面 Maven 模板示例）：step 的写法是 `<动作>@<工具>`（ut@maven、build@maven …），
#              命令放在 `commands:` 列表里，并伴随 checkpoints / settings / caches / notify /
#              strategy.resource 等字段；顶层另有 notify 与 strategy.blocking
#   ❌ 已排除：`shell@1` 不是合法的插件类型（Gitee 报「[插件类型不存在] 不支持的插件类型: shell@1」）
#   ▶ 现用：`build@nodejs`（Gitee Go 的 Node 构建插件；commands 中放 npm 命令）
#   ✅ 已确认（2026-09-14 21:30 运行日志）：`build@nodejs` 能被平台解析 —— 实际执行到
#              /mnt/pipeline-tools/plugins/node/1.0/step.sh；但该插件**不负责安装 Node**，
#              故命令内自带兜底安装（对策 A）
#   ⏳ 仍待确认：`nodeVersion: "20"` 是否被插件接受。若页面报「不支持的版本」，
#              按报错列出的可选值调整（兜底安装写死 v20.18.1，不受影响）
#
# 语法说明（2026-09-14 已用官方模板校正）：
#   Gitee Go 的流水线文件由页面创建时生成（路径 .workflow/<流水线名>.yml，**文件名 = 流水线名**），
#   其官方模板为：
#       version: "1.0"
#       name: <流水线名>
#       displayName: <流水线名>
#       triggers:
#         push:
#           branches:
#             prefix:
#               - ''
#   据此本文件已做两处校正：
#     ① 补 `version: "1.0"`（官方模板必填项，此前缺失）
#     ② 分支过滤由 `branches.include` 改为 `branches.prefix`（**前缀匹配**，故写 `feat/` 而非 `feat/**`）
#     ③ 暂时去掉 `pull_request` 触发段（官方模板未出现该键，避免校验失败）；若页面模板支持，
#        可按其写法补回 `pullRequest` / `pull_request` 并恢复 PR 门禁
#   `stages` / `steps` 段在官方模板中未出现；经页面报错迭代后已确定：steps 直接挂在 stage 对象下（见上方「结构校验进展」）。
#
# 运行环境提示（2026-09-14 21:30 实测后的结论）：
#   - 镜像 ubuntu:plugin-24 **无 Node/npm** → 靠命令内的兜底安装（v20.18.1，三源回退）。
#     要换 Node 版本只改兜底命令里 URL 中的 `v20.18.1`；插件字段 `nodeVersion: "20"` 保留，
#     若页面报「不支持的版本」按报错列出的可选值调整（兜底安装保证不受其影响）
#   - registry：`MdToHtml/.npmrc` 已固定 npmmirror（已入库），故 `npm ci` 走国内源
#   - E2E 需要 Chromium：命令用 `npx playwright install chromium`（未加 --with-deps，
#     以免镜像缺少 apt/sudo 权限）；若因系统库缺失导致浏览器起不来，再改 `--with-deps`
#     或换带浏览器依赖的镜像；下载慢时可在该命令前加
#     `export PLAYWRIGHT_DOWNLOAD_HOST=https://cdn.npmmirror.com/binaries/playwright`
# =============================================================================

version: "1.0"
name: ci
displayName: 'CI — 类型检查 / Lint / 单测 / 构建 / E2E'

triggers:
  push:
    branches:
      prefix:
        - master
        - feat/
        - test/

stages:
# ---------------------------------------------------------------------------
# 阶段一：四道门禁的等价命令（typecheck + lint:strict + test:ci）
# ---------------------------------------------------------------------------
- name: 门禁
  displayName: 类型检查 + 代码规范 + 单元测试与覆盖率
  strategy: naturally
  trigger: auto
  steps:
  - step: build@nodejs
    name: verify
    displayName: 类型检查 + Lint + 单测（含覆盖率阈值 19/14/13/20）
    nodeVersion: "20"
    commands:
    # ① 环境探测：一次把镜像/工作目录/PATH/工具链打印清楚，下次运行看日志即可判断问题是否解决
    - 'printf "==== [1/3] 环境探测 ====\n"; date; uname -a; sed -n 1,2p /etc/os-release 2>/dev/null; id; printf "PWD=%s\n" "$(pwd)"; ls -1; printf "PATH=%s\n" "$PATH"; printf "node=%s\n" "$(command -v node || echo MISSING)"; printf "npm=%s\n" "$(command -v npm || echo MISSING)"; printf "curl=%s\n" "$(command -v curl || echo MISSING)"; printf "wget=%s\n" "$(command -v wget || echo MISSING)"'
    # ② 兜底安装 Node（仅当 npm 不存在）：三源回退 + 按 CPU 架构选包；已存在则直接跳过
    - 'if command -v npm >/dev/null 2>&1; then printf "[2/3] 环境已提供 npm: %s\n" "$(command -v npm)"; else printf "[2/3] 未找到 npm，兜底安装 Node v20.18.1\n"; ARCH=linux-x64; case "$(uname -m)" in aarch64|arm64) ARCH=linux-arm64 ;; esac; mkdir -p "$HOME/node20"; for U in "https://registry.npmmirror.com/-/binary/node/v20.18.1/node-v20.18.1-$ARCH.tar.gz" "https://nodejs.org/dist/v20.18.1/node-v20.18.1-$ARCH.tar.gz" "https://mirrors.tuna.tsinghua.edu.cn/nodejs-release/v20.18.1/node-v20.18.1-$ARCH.tar.gz"; do printf "[2/3] 尝试 %s\n" "$U"; rm -f /tmp/node20.tar.gz; if command -v curl >/dev/null 2>&1; then curl -fsSL --connect-timeout 20 "$U" -o /tmp/node20.tar.gz; else wget -q -T 20 -O /tmp/node20.tar.gz "$U"; fi; if [ -s /tmp/node20.tar.gz ] && tar -xzf /tmp/node20.tar.gz -C "$HOME/node20" --strip-components=1; then printf "[2/3] 解压完成\n"; break; fi; done; fi; export PATH="$HOME/node20/bin:$PATH"; printf "[2/3] node=%s\n" "$(command -v node || echo MISSING)"; printf "[2/3] npm=%s\n" "$(command -v npm || echo MISSING)"'
    # ③ 四道门禁：子 shell 内 cd（cwd 不跨命令泄漏）+ && 串联（任一环节失败则该命令退出码非 0）
    - 'export PATH="$HOME/node20/bin:$PATH"; printf "[3/3] 门禁开始：npm ci → typecheck → lint:strict → test:ci\n"; ( cd MdToHtml && npm ci && npm run typecheck && npm run lint:strict && npm run test:ci )'
    checkpoints: {}
    settings: []
    caches: []
    notify: []
    strategy:
      retry: "0"
      resource:
        cpu: "2"
        memory: "4"

# ---------------------------------------------------------------------------
# 阶段二：生产构建 + E2E（数据隔离：MDTOHTML_CONFIG → .e2e-tmp/）
# ---------------------------------------------------------------------------
- name: 构建与E2E
  displayName: next build + Playwright E2E（7 用例）
  strategy: naturally
  trigger: auto
  steps:
  - step: build@nodejs
    name: e2e
    displayName: 生产构建 + E2E
    nodeVersion: "20"
    commands:
    - cd MdToHtml && npm ci
    - cd MdToHtml && npm run build
    - cd MdToHtml && npx playwright install chromium
    - cd MdToHtml && npm run test:e2e
    checkpoints: {}
    settings: []
    caches: []
    notify: []
    strategy:
      retry: "0"
      resource:
        cpu: "2"
        memory: "4"

notify: []
strategy:
  blocking: true
