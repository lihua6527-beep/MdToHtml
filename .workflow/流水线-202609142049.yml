# ===== 本文件 = Gitee 页面创建的流水线「流水线-202609142049」实际使用的定义 =====
# 与 .workflow/ci.yml 内容一致，仅 name/displayName 不同（Gitee 要求文件名 = 流水线名）。
# 若日后把流水线重命名为 ci，则以 .workflow/ci.yml 为准。
# =============================================================================
# Gitee Go 流水线定义 —— 方案 B（2026-09-14 选定）
#
# 为什么需要这个文件：
#   远端仓库在 Gitee（https://gitee.com/njustzjh/md-to-html），而 .github/workflows/*.yml
#   是 GitHub Actions，Gitee 不会执行它们。要让门禁在远端真实运行，必须改用 Gitee Go。
#
# 与本地门禁的等价关系（本地已实测通过：25 套件 / 213 用例、E2E 7/7）：
#   .github/workflows/ci.yml  build job  →  npm run typecheck && npm run lint:strict && npm run test:ci
#   .github/workflows/ci.yml  e2e   job  →  npm run build（+ npx playwright install chromium）&& npm run test:e2e
#
# 结构校验进展（2026-09-14，据 Gitee 页面实际报错迭代）：
#   ✅ 已确认：version / name / displayName / triggers.push.branches.prefix（依据页面生成的官方模板）
#   ✅ 已修正：steps 必须**直接位于 stage 对象下**（stages[i].steps）。
#              此前写成 stages[i].stage.steps，Gitee 报错：
#              「[配置结构错误] 位置: stages[0].steps - stages[0] 的 steps 配置缺失或格式错误」
#   ✅ 已加固：run 脚本首行加 `set -e`，任一命令失败即该步骤失败（红/绿才有意义）
#   ✅ 已简化：去掉 `variables` 层（路径直接内联），减少未知字段带来的校验风险
#   ⏳ 待验证：step 条目本身（`step: shell@1` + `inputs.run`）以及 stage 层是否仍需 `stage:` 键
#
# 语法说明（2026-09-14 已用官方模板校正）：
#   Gitee Go 的流水线文件由页面创建时生成（路径 .workflow/<流水线名>.yml，**文件名 = 流水线名**），
#   其官方模板为：
#       version: "1.0"
#       name: <流水线名>
#       displayName: <流水线名>
#       triggers:
#         push:
#           branches:
#             prefix:
#               - ''
#   据此本文件已做两处校正：
#     ① 补 `version: "1.0"`（官方模板必填项，此前缺失）
#     ② 分支过滤由 `branches.include` 改为 `branches.prefix`（**前缀匹配**，故写 `feat/` 而非 `feat/**`）
#     ③ 暂时去掉 `pull_request` 触发段（官方模板未出现该键，避免校验失败）；若页面模板支持，
#        可按其写法补回 `pullRequest` / `pull_request` 并恢复 PR 门禁
#   `stages` / `steps` 段在官方模板中未出现，仍是按 Azure-Pipelines 风格编写，首次保存时以页面校验为准。
#
# 运行环境提示：
#   - 若执行镜像未预装 Node 20，请用页面上的「Node」步骤替换 install 步骤，
#     或在流水线设置中指定带 Node 20 的镜像（`环境自检` 步骤会先打印版本以便排查）。
#   - E2E 需要 Chromium，步骤中已包含 `npx playwright install --with-deps chromium`；
#     若镜像缺少 apt/sudo 权限，可改为 `npx playwright install chromium` 并预装系统依赖。
# =============================================================================

version: "1.0"
name: 流水线-202609142049
displayName: 流水线-202609142049

triggers:
  push:
    branches:
      prefix:
        - master
        - feat/
        - test/

stages:
  # ---------------------------------------------------------------------------
  # 阶段一：四道门禁的等价命令（typecheck + lint:strict + test:ci）
  # 结构要点：steps 直接位于 stage 对象下（stages[i].steps），不要嵌 `stage:` 子键
  # ---------------------------------------------------------------------------
  - name: gates
    displayName: '门禁：类型检查 + 代码规范 + 单元测试与覆盖率'
    steps:
      - step: shell@1
        name: verify
        displayName: '环境自检 + 安装依赖 + 四道门禁'
        inputs:
          run: |
            set -e
            echo "=== 环境自检 ==="
            node -v
            npm -v
            echo "=== 安装依赖 ==="
            cd MdToHtml
            npm ci
            echo "=== 类型检查 ==="
            npm run typecheck
            echo "=== 代码规范 ==="
            npm run lint:strict
            echo "=== 单元测试 + 覆盖率（阈值 19/14/13/20）==="
            npm run test:ci

  # ---------------------------------------------------------------------------
  # 阶段二：生产构建 + E2E（数据隔离：MDTOHTML_CONFIG → .e2e-tmp/）
  # ---------------------------------------------------------------------------
  - name: build-and-e2e
    displayName: '构建 + 端到端测试（Playwright / Chromium）'
    steps:
      - step: shell@1
        name: build-and-e2e
        displayName: '生产构建 + E2E（7 用例）'
        inputs:
          run: |
            set -e
            cd MdToHtml
            npm ci
            npm run build
            npx playwright install --with-deps chromium
            npm run test:e2e
