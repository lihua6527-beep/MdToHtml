<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BottomToolbar Layout Debugger</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2C6CFF',
                        'border-soft': '#E2E8F0',
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            background-color: #f1f5f9; /* slate-100 */
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            padding: 40px;
        }
        .debug-container {
            display: flex;
            flex-direction: column;
            gap: 40px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .panel-wrapper {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1);
        }
        .panel-header {
            font-size: 1.125rem;
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #0f172a;
        }
        /* Mock state classes */
        .active-tab {
            background-color: #2C6CFF !important;
            color: white !important;
            box-shadow: 0 4px 6px -1px rgba(44, 108, 255, 0.3);
        }
        .active-item {
            border-color: #0f172a !important;
            transform: scale(1.1);
            ring: 2px solid #0f172a;
            ring-offset: 2px;
        }
        .active-btn {
            background-color: #2C6CFF !important;
            color: white !important;
            border-color: #2C6CFF !important;
            box-shadow: 0 4px 6px -1px rgba(44, 108, 255, 0.2);
        }
    </style>
</head>
<body>

    <div class="debug-container">
        <div class="mb-4">
            <h1 class="text-3xl font-bold text-slate-800 mb-2">BottomToolbar 布局调试</h1>
            <p class="text-slate-500">此页面将 BottomToolbar 的三个面板（主题、布局、卡片）展开显示，方便手动调试样式。</p>
            <p class="text-slate-500 text-sm mt-2">您可以直接修改此 HTML 文件中的 Tailwind 类名来调整布局。</p>
        </div>

        <!-- 1. Theme Panel -->
        <div class="panel-wrapper">
            <div class="panel-header">
                <i data-lucide="palette" class="text-primary"></i>
                主题面板 (Theme Panel)
            </div>
            
            <!-- Mock Content from BottomToolbar -->
            <div class="flex p-3 bg-white border rounded-xl overflow-x-auto h-[180px]">
                <div class="flex-none flex flex-col gap-3 border-r border-slate-200 pr-6 min-w-[180px]">
                    <div class="text-sm font-bold text-slate-400 uppercase tracking-wider mb-2">主题风格</div>
                    <div class="flex gap-4 flex-wrap">
                        <!-- Themes -->
                        <button class="w-8 h-8 rounded-full border-2 border-slate-900 scale-110 ring-2 ring-slate-900 ring-offset-2 transition-all hover:scale-110 shadow-sm" style="background-color: #2C6CFF;" title="Ocean"></button>
                        <button class="w-8 h-8 rounded-full border-2 border-transparent transition-all hover:scale-110 shadow-sm" style="background-color: #6BD0CC;" title="Mint"></button>
                        <button class="w-8 h-8 rounded-full border-2 border-transparent transition-all hover:scale-110 shadow-sm" style="background-color: #6C53B3;" title="Lavender"></button>
                        <button class="w-8 h-8 rounded-full border-2 border-transparent transition-all hover:scale-110 shadow-sm" style="background-color: #41C187;" title="Earth"></button>
                        <button class="w-8 h-8 rounded-full border-2 border-transparent transition-all hover:scale-110 shadow-sm" style="background-color: #855D36;" title="Caramel"></button>
                    </div>
                </div>
                <div class="flex-1 bg-slate-50/50 rounded-lg ml-4 flex items-center justify-center border border-dashed border-slate-200">
                    <span class="text-slate-400 text-sm">（右侧空白区域）</span>
                </div>
            </div>
        </div>

        <!-- 2. Layout Panel -->
        <div class="panel-wrapper">
            <div class="panel-header">
                <i data-lucide="layout-template" class="text-primary"></i>
                布局面板 (Layout Panel)
            </div>

            <!-- Mock Content -->
            <div class="flex p-3 bg-white border rounded-xl overflow-x-auto h-[220px]">
                <!-- Column 1: Layout Mode -->
                <div class="flex-none flex flex-col gap-3 border-r border-dashed border-border-soft pr-6 min-w-[220px]">
                    <div class="flex items-center gap-2 mb-2 bg-slate-100 p-2 rounded">
                        <span class="text-sm font-bold text-slate-500">当前选区:</span>
                        <span class="text-sm font-bold text-slate-800 truncate max-w-[140px]">## 示例章节</span>
                    </div>
                    <div class="text-sm font-bold text-slate-500 uppercase tracking-wider mb-1">布局模式</div>
                    <div class="grid grid-cols-3 gap-3">
                        <button class="p-2 bg-primary text-white border border-primary shadow-md shadow-primary/20 rounded-lg flex flex-col items-center gap-1 transition-all">
                            <i data-lucide="grid" size="18"></i>
                            <span class="text-sm font-medium">并列</span>
                        </button>
                        <button class="p-2 border border-border-soft rounded-lg flex flex-col items-center gap-1 transition-all hover:bg-slate-50">
                            <i data-lucide="list" size="18"></i>
                            <span class="text-sm font-medium">时间轴</span>
                        </button>
                        <button class="p-2 border border-border-soft rounded-lg flex flex-col items-center gap-1 transition-all hover:bg-slate-50">
                            <i data-lucide="component" size="18"></i>
                            <span class="text-sm font-medium">环绕</span>
                        </button>
                        <button class="p-2 border border-border-soft rounded-lg flex flex-col items-center gap-1 transition-all hover:bg-slate-50">
                            <i data-lucide="circle-dot" size="18"></i>
                            <span class="text-sm font-medium">环形</span>
                        </button>
                        <button class="p-2 border border-border-soft rounded-lg flex flex-col items-center gap-1 transition-all hover:bg-slate-50">
                            <i data-lucide="gallery-horizontal" size="18"></i>
                            <span class="text-sm font-medium">轮播</span>
                        </button>
                    </div>
                </div>

                <!-- Column 2: Color & Columns -->
                <div class="flex-none flex flex-col gap-4 border-r border-dashed border-border-soft px-6 min-w-[140px]">
                    <div class="text-sm font-bold text-slate-500 uppercase tracking-wider mb-1">分区配色</div>
                    <div class="grid grid-cols-3 gap-3">
                        <button class="w-8 h-8 rounded-full border-2 border-slate-900 scale-110 ring-2 ring-slate-900 ring-offset-1 flex items-center justify-center shadow-sm" style="background-color: #e2e8f0;"></button>
                        <button class="w-8 h-8 rounded-full border-2 border-transparent flex items-center justify-center shadow-sm hover:scale-105" style="background-color: hsl(12, 76%, 61%);"></button>
                        <button class="w-8 h-8 rounded-full border-2 border-transparent flex items-center justify-center shadow-sm hover:scale-105" style="background-color: hsl(173, 58%, 39%);"></button>
                        <button class="w-8 h-8 rounded-full border-2 border-transparent flex items-center justify-center shadow-sm hover:scale-105" style="background-color: hsl(197, 37%, 24%);"></button>
                        <button class="w-8 h-8 rounded-full border-2 border-transparent flex items-center justify-center shadow-sm hover:scale-105" style="background-color: hsl(43, 74%, 66%);"></button>
                        <button class="w-8 h-8 rounded-full border-2 border-transparent flex items-center justify-center shadow-sm hover:scale-105" style="background-color: hsl(27, 87%, 67%);"></button>
                    </div>
                    
                    <div class="mt-auto">
                        <div class="text-sm font-bold text-slate-500 uppercase tracking-wider mb-2">列数</div>
                        <div class="flex gap-1.5">
                            <button class="w-7 h-7 rounded-md border border-slate-200 flex items-center justify-center text-xs font-bold text-slate-600 hover:bg-slate-100">1</button>
                            <button class="w-7 h-7 rounded-md border border-slate-200 flex items-center justify-center text-xs font-bold text-slate-600 hover:bg-slate-100">2</button>
                            <button class="w-7 h-7 rounded-md bg-primary text-white border-primary shadow-sm flex items-center justify-center text-xs font-bold">3</button>
                            <button class="w-7 h-7 rounded-md border border-slate-200 flex items-center justify-center text-xs font-bold text-slate-600 hover:bg-slate-100">4</button>
                            <button class="w-7 h-7 rounded-md border border-slate-200 flex items-center justify-center text-xs font-bold text-slate-600 hover:bg-slate-100">6</button>
                        </div>
                    </div>
                </div>

                <!-- Column 3: Fine-tuning -->
                <div class="flex-none flex flex-col gap-3 min-w-[140px] px-6">
                     <div class="text-sm font-bold text-slate-500 uppercase tracking-wider mb-1">版式微调</div>
                     <div class="space-y-3">
                        <div class="flex justify-between items-center bg-slate-50 p-2 rounded-lg border border-slate-100">
                             <span class="text-sm font-medium text-slate-600">标题间距</span>
                             <div class="flex gap-1">
                                 <button class="w-6 h-6 flex items-center justify-center text-xs rounded text-slate-500 hover:bg-white">0</button>
                                 <button class="w-6 h-6 flex items-center justify-center text-xs rounded bg-white text-slate-900 shadow-sm font-bold">2</button>
                                 <button class="w-6 h-6 flex items-center justify-center text-xs rounded text-slate-500 hover:bg-white">4</button>
                                 <button class="w-6 h-6 flex items-center justify-center text-xs rounded text-slate-500 hover:bg-white">6</button>
                                 <button class="w-6 h-6 flex items-center justify-center text-xs rounded text-slate-500 hover:bg-white">8</button>
                             </div>
                         </div>
                         <div class="flex justify-between items-center bg-slate-50 p-2 rounded-lg border border-slate-100">
                             <span class="text-sm font-medium text-slate-600">分割线</span>
                             <div class="w-10 h-5 bg-slate-300 rounded-full relative cursor-pointer">
                                 <div class="absolute top-1 left-1 w-3 h-3 bg-white rounded-full shadow-sm"></div>
                             </div>
                         </div>
                     </div>
                     
                     <button class="mt-auto h-9 px-4 bg-primary text-white rounded-lg shadow hover:bg-blue-600 transition-colors flex items-center gap-2 self-start w-full justify-center">
                        <i data-lucide="plus" size="16"></i>
                        <span class="text-xs font-bold">新增卡片</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- 3. Card Panel -->
        <div class="panel-wrapper">
            <div class="panel-header">
                <i data-lucide="app-window" class="text-primary"></i>
                卡片面板 (Card Panel)
            </div>

            <!-- Mock Content -->
            <div class="flex p-3 bg-white border rounded-xl overflow-x-auto h-[240px]">
                <!-- Column 1: Content Style -->
                <div class="flex-none flex flex-col gap-3 border-r border-dashed border-border-soft pr-6 min-w-[280px]">
                    <div class="text-sm font-bold text-slate-500 uppercase tracking-wider mb-1">内容样式</div>
                    <div class="grid grid-cols-2 gap-3">
                        <button class="h-[48px] w-full bg-primary text-white border-primary shadow-md shadow-primary/20 border rounded-lg flex items-center justify-start px-3 gap-3">
                            <i data-lucide="align-left" size="18"></i>
                            <span class="text-sm font-medium">标准 (Normal)</span>
                        </button>
                        <button class="h-[48px] w-full bg-white text-slate-500 border border-border-soft rounded-lg flex items-center justify-start px-3 gap-3 hover:bg-slate-50">
                            <i data-lucide="highlighter" size="18"></i>
                            <span class="text-sm font-medium">高亮 (Highlight)</span>
                        </button>
                        <button class="h-[48px] w-full bg-white text-slate-500 border border-border-soft rounded-lg flex items-center justify-start px-3 gap-3 hover:bg-slate-50">
                            <i data-lucide="quote" size="18"></i>
                            <span class="text-sm font-medium">引用 (Quote)</span>
                        </button>
                        <button class="h-[48px] w-full bg-white text-slate-500 border border-border-soft rounded-lg flex items-center justify-start px-3 gap-3 hover:bg-slate-50">
                            <i data-lucide="code" size="18"></i>
                            <span class="text-sm font-medium">代码 (Code)</span>
                        </button>
                    </div>
                </div>

                <!-- Column 2: Card Shape -->
                <div class="flex-none flex flex-col gap-3 border-r border-dashed border-border-soft px-6 min-w-[180px] overflow-y-auto">
                    <div class="text-sm font-bold text-slate-500 uppercase tracking-wider mb-1">卡片形态</div>
                    <div class="grid grid-cols-1 gap-2">
                        <button class="flex items-center gap-3 p-2 rounded-lg bg-white border-primary shadow-sm ring-1 ring-primary/20 text-left">
                            <div class="w-6 h-4 bg-slate-300 rounded-sm"></div>
                            <span class="text-sm text-slate-700 font-medium">标准矩形</span>
                        </button>
                        <button class="flex items-center gap-3 p-2 rounded-lg hover:bg-slate-100 text-left">
                            <div class="w-6 h-4 bg-slate-300" style="clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);"></div>
                            <span class="text-sm text-slate-700 font-medium">赛博切角</span>
                        </button>
                        <button class="flex items-center gap-3 p-2 rounded-lg hover:bg-slate-100 text-left">
                            <div class="w-6 h-4 bg-slate-300" style="clip-path: polygon(0% 0%, 90% 0%, 100% 50%, 90% 100%, 0% 100%);"></div>
                            <span class="text-sm text-slate-700 font-medium">箭头</span>
                        </button>
                        <button class="flex items-center gap-3 p-2 rounded-lg hover:bg-slate-100 text-left">
                            <div class="w-6 h-4 bg-slate-300 shadow-sm translate-y-[-1px]"></div>
                            <span class="text-sm text-slate-700 font-medium">悬浮</span>
                        </button>
                        <button class="flex items-center gap-3 p-2 rounded-lg hover:bg-slate-100 text-left">
                            <div class="w-4 h-4 bg-slate-300 rounded-full"></div>
                            <span class="text-sm text-slate-700 font-medium">圆形</span>
                        </button>
                    </div>
                </div>

                <!-- Column 3: Extras -->
                <div class="flex-none flex flex-col gap-3 min-w-[160px] px-6">
                     <button class="mt-auto mb-1 py-2 px-4 bg-red-50 text-red-600 border border-red-100 rounded-lg hover:bg-red-100 hover:border-red-200 transition-colors flex items-center justify-center gap-2 w-full">
                        <i data-lucide="trash-2" size="16"></i>
                        <span class="text-sm font-bold">删除卡片</span>
                    </button>
                </div>
            </div>
        </div>

    </div>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();
    </script>
</body>
</html>
