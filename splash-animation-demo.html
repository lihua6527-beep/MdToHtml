<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>开屏动画 - 几何图形演示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .splash-screen {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            animation: fadeIn 0.5s ease-out;
        }

        .logo-container {
            position: relative;
            width: 300px;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-text {
            position: absolute;
            font-size: 48px;
            font-weight: bold;
            color: white;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
            z-index: 10;
            animation: textReveal 1.5s ease-out 0.8s both;
        }

        .shape {
            position: absolute;
            opacity: 0.8;
        }

        .circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            box-shadow: 0 4px 15px rgba(240, 147, 251, 0.4);
        }

        .circle-1 {
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            animation: circle1Anim 2s ease-in-out infinite;
        }

        .circle-2 {
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            animation: circle2Anim 2s ease-in-out infinite 0.5s;
        }

        .circle-3 {
            top: 50%;
            left: 0;
            transform: translateY(-50%);
            animation: circle3Anim 2s ease-in-out infinite 1s;
        }

        .circle-4 {
            top: 50%;
            right: 0;
            transform: translateY(-50%);
            animation: circle4Anim 2s ease-in-out infinite 1.5s;
        }

        .square {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            box-shadow: 0 4px 15px rgba(79, 172, 254, 0.4);
            animation: squareRotate 3s ease-in-out infinite;
        }

        .square-1 {
            top: 20%;
            left: 20%;
            animation-delay: 0s;
        }

        .square-2 {
            top: 20%;
            right: 20%;
            animation-delay: 0.75s;
        }

        .square-3 {
            bottom: 20%;
            left: 20%;
            animation-delay: 1.5s;
        }

        .square-4 {
            bottom: 20%;
            right: 20%;
            animation-delay: 2.25s;
        }

        .triangle {
            width: 0;
            height: 0;
            border-left: 35px solid transparent;
            border-right: 35px solid transparent;
            border-bottom: 60px solid #ffd700;
            filter: drop-shadow(0 4px 8px rgba(255, 215, 0, 0.4));
        }

        .triangle-1 {
            top: 30%;
            left: 35%;
            animation: triangle1Anim 2.5s ease-in-out infinite;
        }

        .triangle-2 {
            top: 30%;
            right: 35%;
            animation: triangle2Anim 2.5s ease-in-out infinite 0.625s;
        }

        .triangle-3 {
            bottom: 30%;
            left: 35%;
            animation: triangle3Anim 2.5s ease-in-out infinite 1.25s;
        }

        .triangle-4 {
            bottom: 30%;
            right: 35%;
            animation: triangle4Anim 2.5s ease-in-out infinite 1.875s;
        }

        .diamond {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            transform: rotate(45deg);
            box-shadow: 0 4px 15px rgba(250, 112, 154, 0.4);
            animation: diamondFloat 2s ease-in-out infinite;
        }

        .diamond-1 {
            top: 40%;
            left: 45%;
            animation-delay: 0s;
        }

        .diamond-2 {
            top: 45%;
            right: 40%;
            animation-delay: 0.5s;
        }

        .diamond-3 {
            bottom: 40%;
            left: 45%;
            animation-delay: 1s;
        }

        .diamond-4 {
            bottom: 45%;
            right: 40%;
            animation-delay: 1.5s;
        }

        .loading-bar {
            position: absolute;
            bottom: 15%;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 4px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 2px;
            overflow: hidden;
        }

        .loading-progress {
            height: 100%;
            background: white;
            border-radius: 2px;
            animation: loadingProgress 2s ease-in-out infinite;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes textReveal {
            0% {
                opacity: 0;
                transform: scale(0.5);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes circle1Anim {
            0%, 100% {
                transform: translateX(-50%) translateY(0);
            }
            50% {
                transform: translateX(-50%) translateY(-20px);
            }
        }

        @keyframes circle2Anim {
            0%, 100% {
                transform: translateX(-50%) translateY(0);
            }
            50% {
                transform: translateX(-50%) translateY(20px);
            }
        }

        @keyframes circle3Anim {
            0%, 100% {
                transform: translateY(-50%) translateX(0);
            }
            50% {
                transform: translateY(-50%) translateX(-20px);
            }
        }

        @keyframes circle4Anim {
            0%, 100% {
                transform: translateY(-50%) translateX(0);
            }
            50% {
                transform: translateY(-50%) translateX(20px);
            }
        }

        @keyframes squareRotate {
            0%, 100% {
                transform: rotate(0deg) scale(1);
            }
            25% {
                transform: rotate(90deg) scale(1.1);
            }
            50% {
                transform: rotate(180deg) scale(1);
            }
            75% {
                transform: rotate(270deg) scale(1.1);
            }
        }

        @keyframes triangle1Anim {
            0%, 100% {
                transform: translate(0, 0) rotate(0deg);
            }
            25% {
                transform: translate(10px, -10px) rotate(90deg);
            }
            50% {
                transform: translate(0, -20px) rotate(180deg);
            }
            75% {
                transform: translate(-10px, -10px) rotate(270deg);
            }
        }

        @keyframes triangle2Anim {
            0%, 100% {
                transform: translate(0, 0) rotate(0deg);
            }
            25% {
                transform: translate(-10px, -10px) rotate(90deg);
            }
            50% {
                transform: translate(0, -20px) rotate(180deg);
            }
            75% {
                transform: translate(10px, -10px) rotate(270deg);
            }
        }

        @keyframes triangle3Anim {
            0%, 100% {
                transform: translate(0, 0) rotate(0deg);
            }
            25% {
                transform: translate(10px, 10px) rotate(90deg);
            }
            50% {
                transform: translate(0, 20px) rotate(180deg);
            }
            75% {
                transform: translate(-10px, 10px) rotate(270deg);
            }
        }

        @keyframes triangle4Anim {
            0%, 100% {
                transform: translate(0, 0) rotate(0deg);
            }
            25% {
                transform: translate(-10px, 10px) rotate(90deg);
            }
            50% {
                transform: translate(0, 20px) rotate(180deg);
            }
            75% {
                transform: translate(10px, 10px) rotate(270deg);
            }
        }

        @keyframes diamondFloat {
            0%, 100% {
                transform: rotate(45deg) translateY(0);
            }
            50% {
                transform: rotate(45deg) translateY(-15px);
            }
        }

        @keyframes loadingProgress {
            0% {
                width: 0%;
                opacity: 1;
            }
            50% {
                width: 70%;
                opacity: 1;
            }
            100% {
                width: 100%;
                opacity: 0;
            }
        }

        .info-panel {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            max-width: 300px;
            font-size: 14px;
            line-height: 1.6;
            color: #333;
        }

        .info-panel h3 {
            margin-bottom: 10px;
            color: #667eea;
            font-size: 16px;
        }

        .info-panel ul {
            list-style: none;
            padding-left: 0;
        }

        .info-panel li {
            margin-bottom: 5px;
            padding-left: 20px;
            position: relative;
        }

        .info-panel li:before {
            content: "✓";
            position: absolute;
            left: 0;
            color: #4facfe;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="splash-screen">
        <div class="logo-container">
            <div class="logo-text">MdToHtml</div>
            
            <div class="shape circle circle-1"></div>
            <div class="shape circle circle-2"></div>
            <div class="shape circle circle-3"></div>
            <div class="shape circle circle-4"></div>
            
            <div class="shape square square-1"></div>
            <div class="shape square square-2"></div>
            <div class="shape square square-3"></div>
            <div class="shape square square-4"></div>
            
            <div class="shape triangle triangle-1"></div>
            <div class="shape triangle triangle-2"></div>
            <div class="shape triangle triangle-3"></div>
            <div class="shape triangle triangle-4"></div>
            
            <div class="shape diamond diamond-1"></div>
            <div class="shape diamond diamond-2"></div>
            <div class="shape diamond diamond-3"></div>
            <div class="shape diamond diamond-4"></div>
        </div>
        
        <div class="loading-bar">
            <div class="loading-progress"></div>
        </div>
    </div>

    <div class="info-panel">
        <h3>动画特性</h3>
        <ul>
            <li>圆形：上下左右平移</li>
            <li>方形：旋转缩放</li>
            <li>三角形：平移旋转组合</li>
            <li>菱形：浮动效果</li>
            <li>渐变背景与阴影</li>
            <li>加载进度条</li>
        </ul>
    </div>
</body>
</html>
